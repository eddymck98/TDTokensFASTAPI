{% extends "base.html" %}

{% block content %}
<div class="admin-portal-container" style="max-width: 600px; margin: 40px auto; padding-bottom: 40px; padding-left: 12px; padding-right: 12px; box-sizing: border-box; width: 100%;">
  <div class="nfl-header" style="text-align: center; margin-bottom: 25px;">
    <h1 style="font-family: 'Bebas Neue', sans-serif; color: #fbbf24; font-size: 38px; letter-spacing: 2px; margin-bottom: 5px;">CONTACT US</h1>
    <p class="nfl-subtitle">Have questions or feedback? Send us a message below.</p>
  </div>

  {% if success %}
    <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; color: #34d399; text-align: center; font-weight: 600; box-sizing: border-box;">
      ✅ Thank you! Your message has been successfully sent.
    </div>
  {% endif %}

  <div style="background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.12); padding: 24px; border-radius: 16px; box-sizing: border-box;">
    <form action="/contact" method="POST">
      <div style="margin-bottom: 15px;">
        <label style="font-weight: 600; color: #f8fafc; display: block; margin-bottom: 5px; font-family: 'Bebas Neue'; font-size: 18px; letter-spacing: 1px;">Your Name / Email:</label>
        <input type="text" name="sender_email" placeholder="Enter your email or name..." required style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.92); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-weight: 600; color: #f8fafc; display: block; margin-bottom: 5px; font-family: 'Bebas Neue'; font-size: 18px; letter-spacing: 1px;">Message:</label>
        <textarea name="message_body" rows="5" placeholder="Type your message here..." required style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.92); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; font-size: 15px; outline: none; resize: vertical; box-sizing: border-box;"></textarea>
      </div>

      <button type="submit" style="background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; padding: 12px 24px; font-family: 'Teko', sans-serif; font-size: 22px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; width: 100%; box-sizing: border-box;">Send Message 🚀</button>
    </form>
  </div>
</div>
{% endblock %}
