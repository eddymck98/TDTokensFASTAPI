{% extends "base.html" %}

{% block content %}
<div style="margin-bottom: 25px;">
    <h2 style="font-family: 'Bebas Neue', sans-serif; font-size: 38px; color: #ffffff; letter-spacing: 2px; margin: 0;">SYSTEM ADMIN MANAGEMENT PORTAL</h2>
    <p style="color: #94a3b8; font-size: 14px; margin: 0;">Publish weekly question slates, configure matchups, and grade outcomes live.</p>
</div>

<!-- Publish Questions Form -->
<div class="matchup-box" style="margin-bottom: 30px; border-left-color: #fbbf24;">
    <h3 style="font-family: 'Bebas Neue'; color: #fbbf24; font-size: 24px; margin-top: 0;">📋 Publish Weekly Questions (Week {{ next_week }})</h3>
    <form action="/admin/questions/publish" method="POST">
        <input type="hidden" name="week_number" value="{{ next_week }}">
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; color: #cbd5e1; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Question 1 Prompt</label>
            <input type="text" name="q1_prompt" required placeholder="e.g., Will QB 1 throw for over 250+ passing yards?" style="width: 100%; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; box-sizing: border-box;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div>
                <label style="display: block; color: #cbd5e1; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Away Team</label>
                <input type="text" name="q1_away" value="🏈 Free Agent / Neutral" style="width: 100%; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display: block; color: #cbd5e1; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Home Team</label>
                <input type="text" name="q1_home" value="🏈 Free Agent / Neutral" style="width: 100%; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; box-sizing: border-box;">
            </div>
        </div>

        <button type="submit" class="submit-btn">Publish Questions for Week {{ next_week }} 💾</button>
    </form>
</div>
{% endblock %}
