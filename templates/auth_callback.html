{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; width: 100%; margin: 40px auto; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); border-left: 4px solid #10b981; border-radius: 16px; padding: 30px 20px; text-align: center; backdrop-filter: blur(14px); box-sizing: border-box;">
    <div style="font-size: 48px; margin-bottom: 15px;">✅</div>
    <h2 style="font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #34d399; margin-bottom: 10px; line-height: 1.1;">Email Verified Successfully!</h2>
    <p style="color: #cbd5e1; font-size: 15px; margin-bottom: 25px; line-height: 1.4;" id="status-text">Your email has been verified. You can now log in to your account.</p>
    
    <a href="/auth/login?verified=true" style="display: inline-block; background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; padding: 12px 28px; border-radius: 10px; font-family: 'Teko', sans-serif; font-size: 22px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);">Proceed to Login 🚀</a>
</div>

<script>
    // Optional: Handle Supabase token hash if it comes through as an implicit grant
    window.addEventListener('DOMContentLoaded', () => {
        const hash = window.location.hash;
        if (hash && hash.includes('access_token')) {
            document.getElementById('status-text').innerText = "Account verified and authenticated!";
        }
    });
</script>
{% endblock %}
